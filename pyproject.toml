[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engine-core"
version = "0.1.0"
description = "Framework-general base for config-driven simulator wrappers (EngineProcess) + an opt-in run-environment capture helper, for the process-bigraph ecosystem."
requires-python = ">=3.11"
dependencies = [
    "bigraph-schema>=1.8.1",
    "process-bigraph>=0.0.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["engine_core"]
