[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viva-engine-core"
version = "0.1.0"
description = "Shared base for config-driven simulator wrappers (EngineProcess) + lean run-environment capture, for the viva / process-bigraph ecosystem."
requires-python = ">=3.11"
dependencies = [
    "bigraph-schema>=1.8.1",
    "process-bigraph>=0.0.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["viva_engine_core"]
